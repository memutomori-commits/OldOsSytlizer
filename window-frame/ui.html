<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Window Frame</title>
<style>
  /* Как и у Retro Bevel: панель живёт в Shadow DOM, чтобы стили PropsKit
     библиотечной сборки не переопределяли button, input и body. */
  #wf-body { margin: 0; padding: 0; background: #C0C0C0; overflow: hidden; }
  #wf-app { display: block; width: 100%; margin: 0; padding: 0; }
</style>
</head>
<body id="wf-body">
<window-frame-app id="wf-app"></window-frame-app>
<template id="wf-template">
<style>
  :host { display: block; }
  .panel {
    all: initial;
    display: block;
    box-sizing: border-box;
    padding: 8px;
    background: #C0C0C0;
    color: #000000;
    font-family: "MS Sans Serif", "Pixelated MS Sans Serif", Tahoma, "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    line-height: 1.2;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    --face: #C0C0C0;
    --light: #FFFFFF;
    --lighter: #DFDFDF;
    --shade: #808080;
    --dark: #0A0A0A;
    --select: #000080;
    --text: #000000;
  }
  *, *::before, *::after { box-sizing: border-box; }

  .raised {
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shade), inset 2px 2px var(--lighter);
  }
  .sunken {
    background: var(--light);
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shade), inset -2px -2px var(--lighter), inset 2px 2px var(--dark);
  }
  .sunken-thin { box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shade); }

  .tabs { display: flex; align-items: flex-end; padding-left: 2px; position: relative; z-index: 1; }
  .tab {
    height: 25px; margin: 0 0 -2px; padding: 2px 10px 2px; background: var(--face); border: 0;
    font: inherit; color: inherit; cursor: default;
    box-shadow: inset -1px 0 var(--dark), inset 1px 1px var(--light), inset -2px 0 var(--shade), inset 2px 2px var(--lighter);
  }
  .page { padding: 10px 10px 8px; }

  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .row label.name { width: 62px; flex: none; }
  .field {
    height: 21px; padding: 2px 4px; border: 0; font: inherit; color: var(--text); background: var(--light);
    outline: none; min-width: 0;
  }
  input.field[type=text] { flex: 1; user-select: text; -webkit-user-select: text; }
  input.field[type=number] { width: 64px; }
  input.field[type=number]::-webkit-inner-spin-button { opacity: 1; }
  .hint { color: var(--shade); text-shadow: 1px 1px 0 var(--light); }

  .check { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; }
  .check input { margin: 0; width: 13px; height: 13px; }

  /* Превью: окно из тех же пропорций, что уходят в Figma (U = 2px). */
  .preview {
    position: relative; height: 72px; margin: 2px 0 0;
    background: repeating-conic-gradient(#9a9a9a 0 25%, #7a7a7a 0 50%) 0 0 / 12px 12px;
  }
  .win { position: absolute; left: 14px; top: 8px; right: 14px; bottom: 8px; }
  .win .bevel { position: absolute; }
  .win .t { left: 0; top: 0; right: 4px; height: 4px; background: #F7F7F7; }
  .win .l { left: 0; top: 0; width: 4px; bottom: 4px; background: #F7F7F7; }
  .win .r { right: 0; top: 0; width: 4px; bottom: 0; background: #000; }
  .win .b { left: 0; bottom: 0; right: 0; height: 4px; background: #000; }
  .win .ri { right: 4px; top: 4px; width: 2px; bottom: 4px; background: #868A8E; }
  .win .bi { left: 4px; bottom: 4px; right: 6px; height: 2px; background: #868A8E; }
  .bar {
    position: absolute; left: 4px; top: 4px; right: 6px; height: 36px;
    padding: 4px 2px 2px 6px; display: flex; align-items: center; gap: 2px;
    background: linear-gradient(90deg, #000, #571415);
  }
  .bar .title {
    flex: 1; min-width: 0; color: #F7F7F7; font: 24px/1 Inter, Arial, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn-prev { position: relative; width: 36px; height: 30px; flex: none; }
  .btn-prev .sh { position: absolute; left: 2px; top: 2px; width: 34px; height: 28px; background: #000; }
  .btn-prev .fc { position: absolute; left: 0; top: 0; width: 34px; height: 28px; background: #C4C4C4;
    box-shadow: inset 4px 4px 0 #F7F7F7, inset -2px -2px 0 #868A8E; }
  .btn-prev .g { position: absolute; left: 12px; top: 6px; width: 12px; height: 18px; image-rendering: pixelated; }
  .btn-prev.off { display: none; }

  .btn {
    height: 23px; min-width: 75px; padding: 0 10px; background: var(--face); border: 0; font: inherit; color: inherit; cursor: default;
  }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 1px dotted var(--text); outline-offset: -4px; }
  .btn:not(:disabled):active {
    padding: 2px 9px 0 11px;
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--dark), inset -2px -2px var(--lighter), inset 2px 2px var(--shade);
  }
  .btn:disabled { color: var(--shade); text-shadow: 1px 1px 0 var(--light); }
  .btn.primary { font-weight: bold; }

  .footer { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .status { flex: 1; min-width: 0; height: 21px; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--face); }
  .status.error { color: #800000; }
</style>
<div class="panel">
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" aria-selected="true" tabindex="-1">Окно</button>
  </div>
  <div class="page raised" role="tabpanel">
    <div class="row">
      <label class="name" for="title">Заголовок</label>
      <input id="title" class="field sunken" type="text" value="WHO??" maxlength="200" spellcheck="false">
    </div>
    <div class="row">
      <label class="name" for="unit">Пиксель, px</label>
      <input id="unit" class="field sunken" type="number" min="0.5" max="64" step="0.01" value="4">
      <span class="hint" title="Единица пиксель-арта: бевель 2, плашка 18, кнопка 18×15, кегль 12. В Carousel post — 3.68">бевель 2, плашка 18</span>
    </div>
    <div class="row">
      <label class="name">Кнопки</label>
      <label class="check"><input id="help" type="checkbox" checked> ?</label>
      <label class="check"><input id="close" type="checkbox" checked> X</label>
    </div>
    <div class="preview sunken-thin" aria-hidden="true">
      <div class="win">
        <div class="bar">
          <span id="preview-title" class="title">WHO??</span>
          <span id="preview-help" class="btn-prev"><span class="sh"></span><span class="fc"></span><canvas class="g" width="6" height="9"></canvas></span>
          <span id="preview-close" class="btn-prev"><span class="sh"></span><span class="fc"></span><canvas class="g" width="6" height="9"></canvas></span>
        </div>
        <div class="bevel t"></div><div class="bevel l"></div><div class="bevel r"></div><div class="bevel b"></div>
        <div class="bevel ri"></div><div class="bevel bi"></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div id="status" class="status sunken-thin" role="status" aria-live="polite"
         title="Каждый выделенный прямоугольник заменяется окном того же размера и положения. Прямоугольник удаляется; Ctrl/Cmd+Z возвращает его.">Выделите прямоугольник</div>
    <button id="run" class="btn raised primary" type="button" disabled>Собрать</button>
  </div>
</div>
</template>

<script>
(function () {
  'use strict';

  const root = document.getElementById('wf-app').attachShadow({ mode: 'open' });
  root.appendChild(document.getElementById('wf-template').content.cloneNode(true));

  const $ = function (id) { return root.getElementById(id); };
  const statusEl = $('status');
  const runButton = $('run');
  let selection = { count: 0, total: 0 };
  let limits = { unitMin: 0.5, unitMax: 64, titleMax: 200 };

  // Те же пиксельные карты, что в code.ts, — только для превью.
  const GLYPHS = {
    help: ['.####.', '#....#', '#....#', '.....#', '...##.', '..#...', '..#...', '......', '..#...'],
    close: ['#....#', '.#..#.', '..##..', '..##..', '..##..', '.#..#.', '#....#'],
  };

  function post(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }

  function plural(n, one, few, many) {
    const m10 = n % 10;
    const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  function drawGlyph(canvas, rows) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    rows.forEach(function (row, y) {
      for (let x = 0; x < row.length; x++) if (row[x] === '#') ctx.fillRect(x, y, 1, 1);
    });
  }

  function readParams() {
    const unit = Number($('unit').value);
    return {
      title: $('title').value.slice(0, limits.titleMax),
      unit: Number.isFinite(unit) ? Math.max(limits.unitMin, Math.min(limits.unitMax, unit)) : 4,
      help: $('help').checked,
      close: $('close').checked,
    };
  }

  function writeParams(p) {
    $('title').value = p.title;
    $('unit').value = p.unit;
    $('help').checked = p.help;
    $('close').checked = p.close;
    updatePreview();
  }

  function updatePreview() {
    const p = readParams();
    $('preview-title').textContent = p.title;
    $('preview-help').classList.toggle('off', !p.help);
    $('preview-close').classList.toggle('off', !p.close);
  }

  function updateState() {
    const hasTargets = selection.count > 0;
    runButton.disabled = !hasTargets;
    statusEl.classList.remove('error');
    if (hasTargets) {
      let text = 'Выбрано: ' + selection.count + ' ' + plural(selection.count, 'прямоугольник', 'прямоугольника', 'прямоугольников');
      if (selection.total > selection.count) text += ' из ' + selection.total;
      statusEl.textContent = text;
    } else {
      statusEl.textContent = 'Выделите прямоугольник';
    }
  }

  window.addEventListener('message', function (event) {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'init') {
      if (msg.limits) limits = msg.limits;
      $('unit').min = limits.unitMin;
      $('unit').max = limits.unitMax;
      writeParams(msg.params);
    } else if (msg.type === 'selection') {
      selection = { count: msg.count, total: msg.total };
      updateState();
    } else if (msg.type === 'status') {
      statusEl.textContent = msg.text;
      statusEl.classList.toggle('error', !!msg.error);
    }
  });

  drawGlyph($('preview-help').querySelector('canvas'), GLYPHS.help);
  drawGlyph($('preview-close').querySelector('canvas'), GLYPHS.close);

  ['title', 'unit', 'help', 'close'].forEach(function (id) {
    $(id).addEventListener('input', updatePreview);
    $(id).addEventListener('change', updatePreview);
  });
  $('title').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !runButton.disabled) post({ type: 'build', params: readParams() });
  });
  runButton.addEventListener('click', function () {
    post({ type: 'build', params: readParams() });
  });

  post({ type: 'ready' });
})();
</script>
</body>
</html>
