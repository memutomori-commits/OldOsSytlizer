<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shader Presets</title>
<style>
  /* Плагины библиотеки Figma получают в iframe стили PropsKit; панель живёт в Shadow DOM. */
  #sp-body { margin: 0; padding: 0; background: #C0C0C0; overflow: hidden; }
  #sp-app { display: block; width: 100%; margin: 0; padding: 0; }
</style>
</head>
<body id="sp-body">
<shader-presets-app id="sp-app"></shader-presets-app>
<template id="sp-template">
<style>
  :host { display: block; }
  .panel {
    all: initial;
    display: block;
    box-sizing: border-box;
    padding: 8px;
    background: #C0C0C0;
    color: #000000;
    font-family: "MS Sans Serif", "Pixelated MS Sans Serif", Tahoma, "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    line-height: 1.2;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    --face: #C0C0C0;
    --light: #FFFFFF;
    --lighter: #DFDFDF;
    --shade: #808080;
    --dark: #0A0A0A;
    --select: #000080;
    --text: #000000;
  }
  *, *::before, *::after { box-sizing: border-box; }

  .raised {
    box-shadow:
      inset -1px -1px var(--dark),
      inset 1px 1px var(--light),
      inset -2px -2px var(--shade),
      inset 2px 2px var(--lighter);
  }
  .sunken {
    box-shadow:
      inset -1px -1px var(--light),
      inset 1px 1px var(--shade),
      inset -2px -2px var(--lighter),
      inset 2px 2px var(--dark);
  }
  .sunken-thin {
    box-shadow:
      inset -1px -1px var(--light),
      inset 1px 1px var(--shade);
  }

  .group {
    position: relative;
    margin: 6px 0 10px;
    padding: 12px 8px 8px;
    box-shadow:
      inset -1px -1px var(--light),
      inset 1px 1px var(--shade),
      inset -2px -2px var(--shade),
      inset 2px 2px var(--light);
  }
  .legend {
    position: absolute;
    top: -6px;
    left: 8px;
    padding: 0 3px;
    background: var(--face);
  }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  textarea {
    display: block;
    width: 100%;
    margin: 0;
    padding: 3px 4px;
    background: var(--light);
    border: 0;
    color: var(--text);
    font: 11px/1.3 "Courier New", Consolas, monospace;
    resize: none;
    user-select: text;
    -webkit-user-select: text;
    outline: none;
  }
  textarea:disabled { background: var(--face); color: var(--shade); }

  .btn {
    min-width: 75px;
    height: 23px;
    padding: 0 10px;
    background: var(--face);
    border: 0;
    font: inherit;
    color: inherit;
    cursor: default;
    white-space: nowrap;
  }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 1px dotted var(--text); outline-offset: -4px; }
  .btn:not(:disabled):active {
    padding: 2px 9px 0 11px;
    box-shadow:
      inset -1px -1px var(--light),
      inset 1px 1px var(--dark),
      inset -2px -2px var(--lighter),
      inset 2px 2px var(--shade);
  }
  .btn:disabled { color: var(--shade); text-shadow: 1px 1px 0 var(--light); }

  .check { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
  .check input { margin: 0; width: 13px; height: 13px; }

  .status {
    height: 21px;
    margin-top: 2px;
    padding: 3px 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty { padding: 6px 0 2px; color: var(--shade); text-shadow: 1px 1px 0 var(--light); }
</style>
<div class="panel">
  <div class="group">
    <span class="legend">Код с выделенного слоя</span>
    <div id="source"></div>
  </div>
  <div class="group">
    <span class="legend">Применить код</span>
    <textarea id="input" class="sunken" rows="3" spellcheck="false" placeholder="Вставьте Preset code"></textarea>
    <label class="check"><input id="add-missing" type="checkbox" checked> Добавить шейдер, если его нет на слое</label>
    <div class="row">
      <span class="label">Применяется ко всем выделенным слоям</span>
      <button id="apply" class="btn raised" type="button" disabled>Применить</button>
    </div>
  </div>
  <div id="status" class="status sunken-thin" role="status" aria-live="polite">Выделите слой</div>
</div>
</template>

<script>
(function () {
  'use strict';

  const root = document.getElementById('sp-app').attachShadow({ mode: 'open' });
  root.appendChild(document.getElementById('sp-template').content.cloneNode(true));

  const sourceEl = root.getElementById('source');
  const inputEl = root.getElementById('input');
  const addMissingEl = root.getElementById('add-missing');
  const applyButton = root.getElementById('apply');
  const statusEl = root.getElementById('status');
  let total = 0;

  function post(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }

  function copyText(textarea, button) {
    textarea.focus();
    textarea.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    const old = button.textContent;
    button.textContent = ok ? 'Скопировано' : 'Выделите и Ctrl+C';
    setTimeout(function () { button.textContent = old; }, 1200);
  }

  function renderSource(layerName, shaders) {
    sourceEl.textContent = '';
    if (!shaders.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = layerName ? 'На слое «' + layerName + '» нет шейдеров Dither или CRT' : 'Выделите слой с шейдером';
      sourceEl.appendChild(empty);
      return;
    }
    shaders.forEach(function (shader) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = shader.name;
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'btn raised';
      copy.textContent = 'Копировать';
      row.appendChild(label);
      row.appendChild(copy);

      const area = document.createElement('textarea');
      area.className = 'sunken';
      area.rows = 3;
      area.readOnly = true;
      area.spellcheck = false;
      area.value = shader.code;

      copy.addEventListener('click', function () { copyText(area, copy); });
      sourceEl.appendChild(row);
      sourceEl.appendChild(area);
    });
  }

  function updateApply() {
    applyButton.disabled = total === 0 || inputEl.value.trim() === '';
  }

  function updateStatus(layerName, shaders) {
    if (total === 0) statusEl.textContent = 'Выделите слой';
    else if (shaders.length) statusEl.textContent = 'Слой: ' + layerName;
    else statusEl.textContent = 'Выделено слоёв: ' + total;
  }

  window.addEventListener('message', function (event) {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'selection') {
      total = msg.total;
      renderSource(msg.layerName, msg.shaders);
      updateStatus(msg.layerName, msg.shaders);
      updateApply();
    }
  });

  inputEl.addEventListener('input', updateApply);
  applyButton.addEventListener('click', function () {
    post({ type: 'apply', code: inputEl.value, addMissing: addMissingEl.checked });
  });

  post({ type: 'ready' });
})();
</script>
</body>
</html>
