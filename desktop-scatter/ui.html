<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Desktop Scatter</title>
<style>
  /* Как и у Retro Bevel: панель живёт в Shadow DOM, чтобы стили PropsKit
     библиотечной сборки не переопределяли button, input и body. */
  #ds-body { margin: 0; padding: 0; background: #C0C0C0; overflow: hidden; }
  #ds-app { display: block; width: 100%; margin: 0; padding: 0; }
</style>
</head>
<body id="ds-body">
<desktop-scatter-app id="ds-app"></desktop-scatter-app>
<template id="ds-template">
<style>
  :host { display: block; }
  .panel {
    all: initial;
    display: block;
    box-sizing: border-box;
    padding: 8px;
    background: #C0C0C0;
    color: #000000;
    font-family: "MS Sans Serif", "Pixelated MS Sans Serif", Tahoma, "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    line-height: 1.2;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    --face: #C0C0C0;
    --light: #FFFFFF;
    --lighter: #DFDFDF;
    --shade: #808080;
    --dark: #0A0A0A;
    --select: #000080;
    --text: #000000;
  }
  *, *::before, *::after { box-sizing: border-box; }

  .raised {
    box-shadow: inset -1px -1px var(--dark), inset 1px 1px var(--light), inset -2px -2px var(--shade), inset 2px 2px var(--lighter);
  }
  .sunken {
    background: var(--light);
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shade), inset -2px -2px var(--lighter), inset 2px 2px var(--dark);
  }
  .sunken-thin { box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shade); }

  .tabs { display: flex; align-items: flex-end; padding-left: 2px; position: relative; z-index: 1; }
  .tab {
    height: 25px; margin: 0 0 -2px; padding: 2px 10px 2px; background: var(--face); border: 0;
    font: inherit; color: inherit; cursor: default;
    box-shadow: inset -1px 0 var(--dark), inset 1px 1px var(--light), inset -2px 0 var(--shade), inset 2px 2px var(--lighter);
  }
  .page { padding: 10px 10px 8px; }

  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .row label.name { width: 62px; flex: none; }
  .field {
    height: 21px; padding: 2px 4px; border: 0; font: inherit; color: var(--text); background: var(--light);
    outline: none; min-width: 0;
  }
  input.field { width: 64px; }
  input.field[type=number]::-webkit-inner-spin-button { opacity: 1; }
  textarea.field { width: 100%; height: 44px; resize: none; padding: 3px 4px; line-height: 1.25; font-family: inherit; }
  .grow { flex: 1; }

  .btn {
    height: 23px; min-width: 23px; padding: 0 8px; background: var(--face); border: 0; font: inherit; color: inherit; cursor: default;
  }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 1px dotted var(--text); outline-offset: -4px; }
  .btn:not(:disabled):active {
    padding: 2px 7px 0 9px;
    box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--dark), inset -2px -2px var(--lighter), inset 2px 2px var(--shade);
  }
  .btn:disabled { color: var(--shade); text-shadow: 1px 1px 0 var(--light); }
  .btn.primary { min-width: 75px; font-weight: bold; }

  .check { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; }
  .check input { margin: 0; width: 13px; height: 13px; }

  fieldset.group { margin: 0 0 8px; padding: 6px 8px 8px; border: 0; box-shadow: inset -1px -1px var(--light), inset 1px 1px var(--shade), inset -2px -2px var(--shade), inset 2px 2px var(--light); }
  fieldset.group legend { padding: 0 3px; }

  .footer { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .status { flex: 1; min-width: 0; height: 21px; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--face); }
  .status.error { color: #800000; }
</style>
<div class="panel">
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" aria-selected="true" tabindex="-1">Рабочий стол</button>
  </div>
  <div class="page raised" role="tabpanel">
    <fieldset class="group">
      <legend>Сид</legend>
      <div class="row" style="margin-bottom:0">
        <button id="seed-prev" class="btn raised" type="button" title="Предыдущий сид">◀</button>
        <input id="seed" class="field sunken" type="number" min="0" max="999999" step="1" value="1" aria-label="Сид">
        <button id="seed-next" class="btn raised" type="button" title="Следующий сид">▶</button>
        <button id="seed-random" class="btn raised grow" type="button" title="Случайный сид">Случайный</button>
      </div>
    </fieldset>

    <div class="row">
      <label class="name" for="count">Ярлыков</label>
      <input id="count" class="field sunken" type="number" min="1" max="200" step="1" value="12">
      <label class="name" for="scale" style="width:auto">Масштаб %</label>
      <input id="scale" class="field sunken" type="number" min="10" max="400" step="5" value="50">
    </div>
    <div class="row">
      <label class="name" for="gap">Зазор</label>
      <input id="gap" class="field sunken" type="number" min="0" max="400" step="2" value="16">
      <label class="name" for="margin" style="width:auto">Поля</label>
      <input id="margin" class="field sunken" type="number" min="0" max="400" step="2" value="16">
    </div>
    <div class="row">
      <span class="name">Раскладка</span>
      <label class="check"><input type="radio" name="mode" value="grid" checked> сетка</label>
      <label class="check"><input type="radio" name="mode" value="free"> вразброс</label>
    </div>
    <div class="row">
      <label class="check"><input id="shortcut" type="checkbox" checked> стрелка ярлыка</label>
      <label class="check"><input id="select-one" type="checkbox"> один выделен</label>
      <label class="check"><input id="live" type="checkbox" checked> сразу</label>
    </div>
    <div class="row" style="align-items:flex-start">
      <label class="name" for="labels">Подписи</label>
      <textarea id="labels" class="field sunken" placeholder="по одной на строку; пусто — из компонентов"></textarea>
    </div>
  </div>
  <div class="footer">
    <div id="status" class="status sunken-thin" role="status" aria-live="polite">Выделите прямоугольник или фрейм</div>
    <button id="run" class="btn raised primary" type="button" disabled>Раскидать</button>
  </div>
</div>
</template>

<script>
(function () {
  'use strict';

  const root = document.getElementById('ds-app').attachShadow({ mode: 'open' });
  root.appendChild(document.getElementById('ds-template').content.cloneNode(true));

  const $ = function (id) { return root.getElementById(id); };
  const statusEl = $('status');
  const runButton = $('run');
  let selectionOk = false;
  let busy = false;

  function post(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }

  function num(id, min, max, fallback) {
    const v = Math.round(Number($(id).value));
    if (!Number.isFinite(v)) return fallback;
    return Math.max(min, Math.min(max, v));
  }

  function readParams() {
    const mode = root.querySelector('input[name=mode]:checked');
    return {
      seed: num('seed', 0, 999999, 1),
      count: num('count', 1, 200, 12),
      mode: mode && mode.value === 'free' ? 'free' : 'grid',
      scale: num('scale', 10, 400, 50),
      gap: num('gap', 0, 400, 16),
      margin: num('margin', 0, 400, 16),
      shortcut: $('shortcut').checked,
      selectOne: $('select-one').checked,
      labels: $('labels').value,
    };
  }

  function writeParams(p) {
    $('seed').value = p.seed;
    $('count').value = p.count;
    $('scale').value = p.scale;
    $('gap').value = p.gap;
    $('margin').value = p.margin;
    const radios = root.querySelectorAll('input[name=mode]');
    for (let i = 0; i < radios.length; i++) radios[i].checked = radios[i].value === p.mode;
    $('shortcut').checked = p.shortcut;
    $('select-one').checked = p.selectOne;
    $('labels').value = p.labels || '';
  }

  function setStatus(text, error) {
    statusEl.textContent = text;
    statusEl.classList.toggle('error', !!error);
  }

  function updateState() {
    runButton.disabled = !selectionOk || busy;
  }

  function scatter() {
    if (!selectionOk || busy) return;
    busy = true;
    updateState();
    setStatus('Раскидываю…', false);
    post({ type: 'scatter', params: readParams() });
  }

  function setSeed(seed) {
    $('seed').value = Math.max(0, Math.min(999999, seed));
    scatter();
  }

  $('seed-prev').addEventListener('click', function () { setSeed(num('seed', 0, 999999, 1) - 1); });
  $('seed-next').addEventListener('click', function () { setSeed(num('seed', 0, 999999, 1) + 1); });
  $('seed-random').addEventListener('click', function () { setSeed(Math.floor(Math.random() * 1000000)); });
  $('seed').addEventListener('change', function () { if ($('live').checked) scatter(); });
  runButton.addEventListener('click', scatter);

  // Остальные параметры перерисовывают стол сразу, если включено «сразу».
  const liveIds = ['count', 'scale', 'gap', 'margin', 'shortcut', 'select-one', 'labels'];
  liveIds.forEach(function (id) {
    $(id).addEventListener('change', function () { if ($('live').checked) scatter(); });
  });
  const radios = root.querySelectorAll('input[name=mode]');
  for (let i = 0; i < radios.length; i++) {
    radios[i].addEventListener('change', function () { if ($('live').checked) scatter(); });
  }

  window.addEventListener('message', function (event) {
    const msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'selection') {
      selectionOk = !!msg.ok;
      if (msg.params) writeParams(msg.params);
      if (!busy) setStatus(msg.text, !selectionOk);
      updateState();
    } else if (msg.type === 'status') {
      busy = false;
      setStatus(msg.text, !!msg.error);
      updateState();
    }
  });

  post({ type: 'ready' });
})();
</script>
</body>
</html>
